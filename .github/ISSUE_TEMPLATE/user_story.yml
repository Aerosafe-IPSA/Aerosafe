name: Tâche du backlog
description: Une fonctionnalité ou une tâche à faire pendant un sprint
labels: ["user-story"]
body:
  - type: textarea
    id: objectif
    attributes:
      label: Objectif
      description: Ce que nous souhaitons obtenir et pourquoi, en une ou deux phrases.
      placeholder: "Nous souhaitons que le superviseur puisse filtrer les alertes pour traiter en priorité les plus graves."
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères de validation
      description: Ce qui doit être vrai pour considérer la tâche terminée.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorité
      options: ["Must", "Should", "Could"]
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Points
      options: ["1", "2", "3", "5", "8"]
    validations:
      required: true
