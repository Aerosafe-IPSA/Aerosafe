<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard AeroSafe</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:20px;
}

h1{
    text-align:center;
}

.stats{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#0078d4;
    color:white;
}

#map{
    height:400px;
    margin-top:20px;
    border-radius:10px;
}

</style>
</head>

<body>

<h1>Dashboard Superviseur AeroSafe</h1>

<div class="stats">

    <div class="card">
        <h2>4</h2>
        <p>Avions suivis</p>
    </div>

    <div class="card">
        <h2>2</h2>
        <p>Alertes actives</p>
    </div>

</div>

<h2>Tableau des alertes</h2>

<table>

<thead>
<tr>
<th>Code</th>
<th>Alerte</th>
<th>Niveau</th>
</tr>
</thead>

<tbody>

<tr>
<td>AF001</td>
<td>Altitude élevée</td>
<td>Élevé</td>
</tr>

<tr>
<td>LH303</td>
<td>Maintenance requise</td>
<td>Moyen</td>
</tr>

</tbody>

</table>

<h2>Carte des avions</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([48.8566,2.3522],5);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

L.marker([48.8566,2.3522]).addTo(map)
.bindPopup("AF001");

L.marker([45.7640,4.8357]).addTo(map)
.bindPopup("LH303");

L.marker([43.6047,1.4442]).addTo(map)
.bindPopup("BA202");

L.marker([50.6292,3.0573]).addTo(map)
.bindPopup("IB404");

</script>

</body>
</html>
